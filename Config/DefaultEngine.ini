[/Script/Engine.CollisionProfile]
; 玩家/敌人独立胶囊对象通道 (2026-08-31)
; 需求: 玩家↔玩家无碰撞(切换人物时两人同时在场), 玩家↔敌人碰撞, 全部在 Capsule 上。
; ⚠ 两个关键坑 (2026-08-31):
; ① CustomResponses 非空时 Profile 从全 ECR_Ignore 开始, 只应用列出的条目 —
;    世界通道必须显式列出。
; ② 新通道 DefaultResponse 必须 = ECR_Block: 所有未显式配置新通道的对象
;    (地板 BlockAllDynamic 等, 空 CustomResponses → 用各通道 DefaultResponse
;    填充响应矩阵) 对胶囊通道的响应来自这里; 而 CMC 的地板检测 sweep 用的是
;    胶囊的 object type 做通道 — DefaultResponse=Ignore 会让角色永远穿地。
;    自己的 ZZZPlayer/ZZZEnemy profile 显式配置, 不受 DefaultResponse 影响。
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,Name="PlayerCapsule",DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False)
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,Name="EnemyCapsule",DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False)
+Profiles=(Name="ZZZPlayer",CollisionEnabled=QueryAndPhysics,ObjectTypeName="PlayerCapsule",CustomResponses=((Channel="EnemyCapsule",Response=ECR_Block),(Channel="PlayerCapsule",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="WorldStatic",Response=ECR_Block),(Channel="WorldDynamic",Response=ECR_Block)),HelpMessage="ZZZ player capsule: blocks enemies + world, ignores other players (switch keeps two members on stage)")
+Profiles=(Name="ZZZEnemy",CollisionEnabled=QueryAndPhysics,ObjectTypeName="EnemyCapsule",CustomResponses=((Channel="PlayerCapsule",Response=ECR_Block),(Channel="EnemyCapsule",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="WorldStatic",Response=ECR_Block),(Channel="WorldDynamic",Response=ECR_Block)),HelpMessage="ZZZ enemy capsule: blocks players + world, ignores other enemies")

